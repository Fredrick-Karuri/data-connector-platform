[mypy]
python_version = 3.14

plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True

[mypy.plugins.django-stubs]
django_settings_module = "core.settings"

[mypy-*.migrations.*]
ignore_errors = True
